---
name: Project Continuous Integration

on: # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: $/.github/actions/setup-project
        with:
          node-version: '26.x'

      - name: Check formatting
        run: npm run format

  spellcheck:
    name: Spellcheck
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: $/.github/actions/setup-project
        with:
          node-version: '26.x'

      - name: Check spelling
        run: npm run spellcheck

  static-quality:
    name: Static quality
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: $/.github/actions/setup-project
        with:
          node-version: '26.x'

      - name: Run remaining static quality checks
        run: npm run quality:static:ci

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          node-version: '26.x'

      - name: Audit pull-request dependencies
        id: audit
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: npm run audit

      - name: Report dependency audit
        if: steps.audit.outcome == 'failure'
        run: |
          echo '::warning title=Dependency security findings::Review Dependabot alerts and audit output. Dependency findings are reported but do not block pull-request remediation.'
          echo '## Dependency security findings' >> "$GITHUB_STEP_SUMMARY"
          echo 'The dependency audit found blocking-severity advisories. Review the audit output and Dependabot alerts. Deployment security gates remain blocking.' >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce dependency audit before deployment
        if: github.event_name == 'push'
        run: npm run audit

  unit-tests:
    name: Unit tests and coverage
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: $/.github/actions/setup-project
        with:
          node-version: '26.x'

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-coverage
          path: coverage
          if-no-files-found: error
          retention-days: 7

  build:
    name: Production build
    needs:
      - format
      - spellcheck
      - static-quality
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: $/.github/actions/setup-project
        with:
          node-version: '26.x'

      - name: Build production site once
        run: npm run build

      - name: Upload production build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-build
          path: dist
          if-no-files-found: error
          retention-days: 7

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  validate-build:
    name: Validate build
    needs:
      - build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: $/.github/actions/setup-project
        with:
          node-version: '26.x'

      - name: Download production build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: site-build
          path: dist

      - name: Validate production artifacts
        run: npm run validate:build

  browser-tests:
    name: Browser and accessibility tests
    needs:
      - build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: $/.github/actions/setup-project
        with:
          node-version: '26.x'

      - name: Install supported browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Download production build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: site-build
          path: dist

      - name: Run browser and accessibility tests
        run: npm run test:e2e

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-test-failures
          path: |
            playwright-report
            test-results
          if-no-files-found: error
          retention-days: 7

  lighthouse:
    name: Lighthouse budgets
    needs:
      - build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup project
        uses: $/.github/actions/setup-project
        with:
          node-version: '26.x'

      - name: Install Lighthouse browser
        run: npx playwright install --with-deps chromium

      - name: Download production build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: site-build
          path: dist

      - name: Enforce Lighthouse budgets
        run: npm run lighthouse:ci

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports
          path: .lighthouseci
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  project:
    name: Project
    needs:
      - format
      - spellcheck
      - static-quality
      - dependency-audit
      - unit-tests
      - build
      - validate-build
      - browser-tests
      - lighthouse
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Confirm project checks
        run: echo "All project checks passed."

  deploy:
    name: Deploy GitHub Pages
    needs:
      - build
      - project
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
